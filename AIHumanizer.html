<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botpress Chatbots</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Botpress embedded container */
    #bp-embedded-webchat {
      width: 95vw;          /* Almost full width */
      height: 95vh;         /* Almost full screen height */
      max-width: 1800px;    /* Allows it to be much wider on large monitors */
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      background: white;
    }
  </style>
</head>
<body>
   <iframe
    src="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/07/05/18/20260705182527-8EHVSEMW.json"
    width="100%"
    height="100%"
    style="border:none;">
</iframe>
    
    

</body>
</html>
