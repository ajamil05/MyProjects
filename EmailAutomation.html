<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Automations</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    /* Main container */
    .video-container {
      width: 95vw;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 0;
    }

    /* Each video section */
    .video-item {
      width: 100%;
      margin-bottom: 50px;
    }

    /* Video title */
    .video-item h2 {
      margin-bottom: 15px;
      font-size: 28px;
      color: #111;
      text-align: center;
    }

    /* Responsive Vimeo video */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      background: white;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Mobile devices */
    @media (max-width: 600px) {
      .video-container {
        width: 95vw;
        padding: 20px 0;
      }

      .video-item h2 {
        font-size: 22px;
      }

      .video-item {
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="video-container">

          referrerpolicy="strict-origin-when-cross-origin"
